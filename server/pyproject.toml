[project]
name = "open-speechy-server"
version = "0.1.0"
description = "Loopback-only local speech server for Open Speechy"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<9",
  "ruff>=0.6,<1",
]
engines = [
  "chatterbox-tts @ git+https://github.com/resemble-ai/chatterbox.git@5de7a54aa4e5e2baadb0182dde554908b48b85c2",
  "huggingface-hub>=0.25,<1",
  "kokoro==0.9.4",
  "silma-tts==1.0.5",
  "torchaudio>=2.6,<2.7",
  "uroman>=1.3",
]

[tool.setuptools]
packages = ["server", "server.engines"]
package-dir = { server = "." }

[tool.setuptools.package-data]
server = ["models.json", "launchd/*.plist"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 88
target-version = "py311"
