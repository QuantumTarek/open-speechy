<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
  <!-- Drawn on the 16 px grid so the bars stay sharp in the toolbar. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6b78f5"/>
      <stop offset="1" stop-color="#3540b8"/>
    </linearGradient>
  </defs>
  <rect width="16" height="16" rx="3.5" fill="url(#bg)"/>
  <rect x="1" y="6" width="2" height="4" rx="1.0" fill="#e0e3ff"/>
  <rect x="4" y="4" width="2" height="8" rx="1.0" fill="#e0e3ff"/>
  <rect x="7" y="2" width="2" height="12" rx="1.0" fill="#ffffff"/>
  <rect x="10" y="4" width="2" height="8" rx="1.0" fill="#e0e3ff"/>
  <rect x="13" y="6" width="2" height="4" rx="1.0" fill="#e0e3ff"/>
</svg>
